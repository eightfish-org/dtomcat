[package]
name = "dtomcat"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.4"
env_logger = "0.11.5"
hex = "0.4.3"
log = "0.4.22"
nix = { version = "0.29.0", features = ["process", "signal"] }
redis = { version = "0.27.2", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
tokio = { version = "1.40.0", features = ["full"] }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
anyhow = "1.0.86"
futures-util = "0.3.31"
